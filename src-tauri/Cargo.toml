[package]
name = "vj-modular-strobe"
version = "1.0.0"
description = "VJ Modular Strobe Engine - Professional Visual Performance System"
edition = "2021"

[lib]
name = "vj_modular_strobe_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
