services:
  vj-strobe-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vj-modular-strobe-engine
    restart: unless-stopped
    ports:
      - "20023:20023"
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:20023/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
